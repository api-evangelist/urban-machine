name: Urban Machine
description: Urban Machine is a GV-backed robotics company building AI and computer-vision
  powered machines that remove metal fasteners (nails, staples, and screws) from construction
  and demolition lumber waste, reclaiming it for premium wood products and circular-economy
  reuse. The company publishes no public API, but maintains an open-source ROS/Python
  robotics tooling footprint on GitHub, including the colcon-poetry-ros package on PyPI.
